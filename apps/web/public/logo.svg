<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="cardFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Back card (rotated left) -->
  <g filter="url(#shadow)">
    <rect x="126" y="80" width="160" height="220" rx="16" fill="url(#cardGrad)" transform="rotate(-12 206 190)" opacity="0.6"/>
  </g>

  <!-- Back card (rotated right) -->
  <g filter="url(#shadow)">
    <rect x="226" y="80" width="160" height="220" rx="16" fill="url(#cardGrad)" transform="rotate(8 306 190)" opacity="0.4"/>
  </g>

  <!-- Main card -->
  <g filter="url(#shadow)">
    <rect x="176" y="70" width="160" height="220" rx="16" fill="url(#cardFace)" stroke="url(#cardGrad)" stroke-width="3"/>

    <!-- Lightning bolt (agile sprint motif) -->
    <g filter="url(#glow)">
      <path d="M272 120 L240 175 L262 175 L238 240 L290 165 L265 165 L290 120Z" fill="url(#accentGrad)"/>
    </g>

    <!-- Corner pips -->
    <text x="192" y="105" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#818cf8">M</text>
    <text x="318" y="275" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#818cf8" text-anchor="end" transform="rotate(180 318 265)">M</text>
  </g>

  <!-- "MIGHTY" text -->
  <text x="256" y="345" font-family="Inter, sans-serif" font-size="56" font-weight="800" fill="#f1f5f9" text-anchor="middle" letter-spacing="-1">MIGHTY</text>

  <!-- "POKER" text -->
  <text x="256" y="395" font-family="Inter, sans-serif" font-size="36" font-weight="600" fill="url(#accentGrad)" text-anchor="middle" letter-spacing="8">POKER</text>

  <!-- Subtle tagline -->
  <text x="256" y="430" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle" letter-spacing="3">PLANNING POKER</text>
</svg>
